[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engsep"
version = "0.1.0"
description = "Separation processes in Python: validated methods for phase equilibrium, flash, distillation, absorption, extraction, adsorption, membranes, crystallization, drying and evaporation, with an 18-notebook course."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yanwei Wang", email = "wangyanwei@gmail.com" }]
keywords = ["separation processes", "distillation", "absorption", "extraction", "adsorption", "membranes",
            "crystallization", "chemical engineering", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Education",
]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.7", "pandas>=1.5", "jupyterlab>=4"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "pandas>=1.5", "nbformat>=5", "nbclient>=0.9", "ipykernel>=6",
       "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/ktwyw/engsep"
Issues = "https://github.com/ktwyw/engsep/issues"
Validation = "https://github.com/ktwyw/engsep/blob/main/docs/VALIDATION.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engsep = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/engsep"]
addopts = "--doctest-modules"
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:engsep.*"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks/*.ipynb", "solutions/*.ipynb"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E501"]
"tools/*" = ["E501", "E702"]
"notebooks/*.py" = ["E501", "E702"]
"solutions/*.py" = ["E501", "E702"]
"tests/*" = ["E501"]
"src/engsep/datasets.py" = ["E501"]
